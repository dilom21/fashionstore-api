# Requires an existing certificate for fashionstore-api.duckdns.org
# placed on the EC2 HOST under /etc/letsencrypt (managed by Harold).
# Do not start HTTPS Nginx before certificate exists.
limit_req_zone $binary_remote_addr zone=saas_login:10m rate=5r/m;
upstream fashionstore_fastapi { server api:8000; keepalive 16; }

server {
    listen 80;
    server_name fashionstore-api.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fashionstore-api.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/fashionstore-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fashionstore-api.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # Single gateway IP rate limit across all backend workers.
    # Nginx returns 429 on excessive login attempts; tune with real traffic.
    location = /saas/superadmin/auth/login {
        limit_req zone=saas_login burst=5 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_pass http://fashionstore_fastapi;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_pass http://fashionstore_fastapi;
    }
}
